name: Patch AI

# Patch AI lives in patch-ai/ until it moves to its own repository; then move
# this file to that repository's .github/workflows/ and drop the path filters
# and the patch-ai/ prefixes.
on:
  push:
    branches: [main, "cursor/**"]
    paths: ["patch-ai/**", ".github/workflows/patch-ai.yml"]
  pull_request:
    paths: ["patch-ai/**", ".github/workflows/patch-ai.yml"]

permissions:
  contents: read

concurrency:
  group: patch-ai-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://patchai:patchai@localhost:5432/patchai

jobs:
  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patchai
          POSTGRES_PASSWORD: patchai
          POSTGRES_DB: patchai
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: patch-ai/apps/web
    env:
      AUTH_SECRET: ci-only-auth-secret-not-used-in-production
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: patch-ai/apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npm run typecheck
      - run: npm test
      - name: Migrations apply cleanly
        run: npm run db:migrate
      - run: npm run build

  worker:
    name: Worker (lint, tests, live-scan smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patchai
          POSTGRES_PASSWORD: patchai
          POSTGRES_DB: patchai
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: patch-ai/apps/web/package-lock.json
      - name: Install scanners
        run: sudo DEST=/usr/local/bin bash patch-ai/infra/install-scanners.sh
      - name: Install worker
        working-directory: patch-ai/workers/scanner
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Apply database migrations
        working-directory: patch-ai/apps/web
        run: npm ci && npm run db:migrate
      - name: Lint
        working-directory: patch-ai/workers/scanner
        run: .venv/bin/ruff check .
      - name: Tests
        working-directory: patch-ai/workers/scanner
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          # The egress guard only forwards to ports 80/443; let tests bind a local port 80.
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
          .venv/bin/pytest -q

  self-scan:
    name: Scan Patch AI with its own scanners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install scanners
        run: sudo DEST=/usr/local/bin bash patch-ai/infra/install-scanners.sh
      - name: Secrets (committed history under patch-ai/)
        run: gitleaks git . --redact --no-banner --log-opts="-- patch-ai"
      - name: In-house rules (excluding deliberately vulnerable fixtures)
        working-directory: patch-ai
        run: opengrep scan --config workers/scanner/rules --exclude tests/fixtures --error --quiet .
      - name: Dependencies
        working-directory: patch-ai
        run: |
          trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --skip-dirs workers/scanner/tests/fixtures \
            --ignore-unfixed --quiet .
