rules:
  - id: patchai.python.sql-injection.string-format
    languages: [python]
    severity: ERROR
    message: >-
      SQL query built with string formatting or concatenation. If any part comes from user input,
      an attacker can change the query. Use parameterized queries (e.g. cursor.execute(sql, params)).
    metadata: { cwe: "CWE-89", category: sast, confidence: MEDIUM }
    patterns:
      - pattern-either:
          - pattern: $DB.execute("..." % $X, ...)
          - pattern: $DB.execute("..." + $X, ...)
          - pattern: $DB.execute(f"...", ...)
          - pattern: $DB.execute("...".format(...), ...)
          - pattern: $DB.executemany("..." % $X, ...)
          - pattern: $DB.raw("..." % $X, ...)
          - pattern: $DB.raw(f"...", ...)

  - id: patchai.python.command-injection.shell-true
    languages: [python]
    severity: ERROR
    message: >-
      A subprocess runs through the shell with a non-constant command. Shell metacharacters in the
      input lead to command injection. Pass an argument list and drop shell=True.
    metadata: { cwe: "CWE-78", category: sast, confidence: HIGH }
    patterns:
      - pattern-either:
          - pattern: subprocess.$F($CMD, ..., shell=True, ...)
      - pattern-not: subprocess.$F("...", ..., shell=True, ...)

  - id: patchai.python.command-injection.os-system
    languages: [python]
    severity: ERROR
    message: os.system/os.popen with a non-constant command allows command injection. Use subprocess with an argument list.
    metadata: { cwe: "CWE-78", category: sast, confidence: MEDIUM }
    patterns:
      - pattern-either:
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD, ...)
      - pattern-not: os.system("...")
      - pattern-not: os.popen("...", ...)

  - id: patchai.python.deserialization.pickle
    languages: [python]
    severity: ERROR
    message: Unpickling data you don't fully control executes arbitrary code. Use JSON or a safe schema-based format.
    metadata: { cwe: "CWE-502", category: sast, confidence: MEDIUM }
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: cPickle.loads(...)
      - pattern: dill.loads(...)

  - id: patchai.python.deserialization.yaml-load
    languages: [python]
    severity: ERROR
    message: yaml.load without SafeLoader can construct arbitrary Python objects. Use yaml.safe_load.
    metadata: { cwe: "CWE-502", category: sast, confidence: HIGH }
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)

  - id: patchai.python.code-injection.eval
    languages: [python]
    severity: ERROR
    message: eval/exec on non-constant input can execute attacker-supplied code. Use ast.literal_eval or a parser.
    metadata: { cwe: "CWE-95", category: sast, confidence: MEDIUM }
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: exec($X)
      - pattern-not: eval("...")
      - pattern-not: exec("...")

  - id: patchai.python.crypto.weak-hash
    languages: [python]
    severity: WARNING
    message: MD5 and SHA-1 are broken for security purposes. Use SHA-256, or bcrypt/argon2 for passwords.
    metadata: { cwe: "CWE-327", category: sast, confidence: LOW }
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)

  - id: patchai.python.flask.debug-enabled
    languages: [python]
    severity: WARNING
    message: Flask debug mode exposes an interactive debugger that allows remote code execution. Never enable it in production.
    metadata: { cwe: "CWE-489", category: sast, confidence: HIGH }
    pattern: $APP.run(..., debug=True, ...)

  - id: patchai.python.tls.verify-disabled
    languages: [python]
    severity: WARNING
    message: TLS certificate verification is disabled, allowing man-in-the-middle attacks.
    metadata: { cwe: "CWE-295", category: sast, confidence: HIGH }
    pattern-either:
      - pattern: requests.$M(..., verify=False, ...)
      - pattern: httpx.$M(..., verify=False, ...)

  - id: patchai.python.ssrf.requests-user-url
    languages: [python]
    severity: WARNING
    message: An HTTP request is made to a URL taken from the request. Validate it against an allowlist to prevent SSRF.
    metadata: { cwe: "CWE-918", category: sast, confidence: MEDIUM }
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.args[...]
          - pattern: request.json
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.$M($URL, ...)
              - pattern: urllib.request.urlopen($URL, ...)
          - focus-metavariable: $URL

  - id: patchai.python.path-traversal.open-user-input
    languages: [python]
    severity: WARNING
    message: A file path built from request data is opened. Normalize it and confirm it stays inside the intended directory.
    metadata: { cwe: "CWE-22", category: sast, confidence: MEDIUM }
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.args[...]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($P, ...)
              - pattern: send_file($P, ...)
          - focus-metavariable: $P
