rules:
  - id: patchai.js.command-injection.child-process
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      child_process exec/execSync runs a shell with a non-constant command. Use execFile/spawn with an
      argument array, and never pass request data to a shell.
    metadata: { cwe: "CWE-78", category: sast, confidence: MEDIUM }
    patterns:
      - pattern-either:
          - pattern: exec($CMD, ...)
          - pattern: execSync($CMD, ...)
          - pattern: $CP.exec($CMD, ...)
          - pattern: $CP.execSync($CMD, ...)
      - pattern-not: exec("...", ...)
      - pattern-not: execSync("...", ...)
      - pattern-not: $CP.exec("...", ...)
      - pattern-not: $CP.execSync("...", ...)
      - pattern-not: $RE.exec($X)

  - id: patchai.js.code-injection.eval
    languages: [javascript, typescript]
    severity: ERROR
    message: eval/new Function on non-constant input executes attacker-controlled code.
    metadata: { cwe: "CWE-95", category: sast, confidence: MEDIUM }
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(...)
          - pattern: setTimeout($X, ...)
      - pattern-not: eval("...")
      - pattern-not: setTimeout(function (...) {...}, ...)
      - pattern-not: setTimeout(() => {...}, ...)
      - pattern-not: setTimeout(($...ARGS) => $BODY, ...)
      - pattern-not: setTimeout($FN, ...)

  - id: patchai.js.xss.express-send-request-data
    languages: [javascript, typescript]
    severity: ERROR
    message: Request data is written into an HTML response without escaping, allowing cross-site scripting. Escape output or use a template engine with autoescaping.
    metadata: { cwe: "CWE-79", category: sast, confidence: MEDIUM }
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($X)
              - pattern: $RES.write($X)
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern-either:
          - pattern: escape(...)
          - pattern: escapeHtml(...)
          - pattern: encodeURIComponent(...)
          - pattern: JSON.stringify(...)

  - id: patchai.js.xss.dangerously-set-inner-html
    languages: [javascript, typescript]
    severity: WARNING
    message: dangerouslySetInnerHTML with non-constant content can lead to XSS. Sanitize with DOMPurify first.
    metadata: { cwe: "CWE-79", category: sast, confidence: LOW }
    patterns:
      - pattern: "<$EL dangerouslySetInnerHTML={{__html: $X}} />"
      - pattern-not: "<$EL dangerouslySetInnerHTML={{__html: \"...\"}} />"

  - id: patchai.js.xss.inner-html
    languages: [javascript, typescript]
    severity: WARNING
    message: Assigning non-constant content to innerHTML/outerHTML can lead to XSS. Use textContent or sanitize.
    metadata: { cwe: "CWE-79", category: sast, confidence: LOW }
    patterns:
      - pattern-either:
          - pattern: $E.innerHTML = $X
          - pattern: $E.outerHTML = $X
      - pattern-not: $E.innerHTML = "..."
      - pattern-not: $E.outerHTML = "..."

  - id: patchai.js.sql-injection.template-query
    languages: [javascript, typescript]
    severity: ERROR
    message: SQL built with string concatenation or interpolation. Use parameterized queries or a tagged-template SQL client.
    metadata: { cwe: "CWE-89", category: sast, confidence: MEDIUM }
    pattern-either:
      - pattern: $DB.query("..." + $X, ...)
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.execute("..." + $X, ...)
      - pattern: $DB.execute(`...${$X}...`, ...)
      - pattern: $DB.raw(`...${$X}...`, ...)
      - pattern: $DB.$queryRawUnsafe(...)
      - pattern: $DB.$executeRawUnsafe(...)

  - id: patchai.js.ssrf.fetch-request-url
    languages: [javascript, typescript]
    severity: WARNING
    message: A server-side HTTP request targets a URL from request data. Validate it against an allowlist to prevent SSRF.
    metadata: { cwe: "CWE-918", category: sast, confidence: MEDIUM }
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: axios.get($URL, ...)
              - pattern: axios.post($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: http.get($URL, ...)
              - pattern: https.get($URL, ...)
          - focus-metavariable: $URL

  - id: patchai.js.jwt.none-or-unverified
    languages: [javascript, typescript]
    severity: ERROR
    message: JWT accepts the "none" algorithm or is only decoded, not verified. Use jwt.verify with an explicit algorithm list.
    metadata: { cwe: "CWE-347", category: sast, confidence: MEDIUM }
    pattern-either:
      - pattern: 'jwt.verify($T, $K, {..., algorithms: [..., "none", ...], ...})'
      - pattern: |
          $P = jwt.decode($T, ...);
          ...
          if (<... $P ...>) { ... }

  - id: patchai.js.crypto.weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: MD5 and SHA-1 are broken for security purposes. Use SHA-256, or bcrypt/argon2 for passwords.
    metadata: { cwe: "CWE-327", category: sast, confidence: LOW }
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")

  - id: patchai.js.tls.reject-unauthorized-false
    languages: [javascript, typescript]
    severity: WARNING
    message: TLS certificate verification is disabled, allowing man-in-the-middle attacks.
    metadata: { cwe: "CWE-295", category: sast, confidence: HIGH }
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: patchai.js.cors.wildcard-with-credentials
    languages: [javascript, typescript]
    severity: WARNING
    message: CORS reflects any origin while allowing credentials, letting any website make authenticated requests.
    metadata: { cwe: "CWE-942", category: sast, confidence: MEDIUM }
    pattern-either:
      - pattern: "cors({..., origin: true, ..., credentials: true, ...})"
      - pattern: "cors({..., credentials: true, ..., origin: true, ...})"
