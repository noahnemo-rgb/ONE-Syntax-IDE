[project]
name = "patchai-worker"
version = "0.1.0"
description = "Patch AI scan worker: sandboxed code and live-target scanning"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.9,<3",
  "dnspython>=2.7,<3",
  "httpx>=0.28,<1",
  "bandit>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
patchai-worker = "patchai_worker.main:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["patchai_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
